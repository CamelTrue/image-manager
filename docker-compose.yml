services:
  backend:
    build: ./backend
    container_name: image-manager-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=data/database.sqlite
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=900
      - REFRESH_EXPIRES_IN=604800
      - STORAGE_PATH=/data/images
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    volumes:
      - e_images:/data/images
      - db_data:/app/data

  frontend:
    build: ./frontend
    container_name: image-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  e_images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:/images
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/IT/image-manager/data
